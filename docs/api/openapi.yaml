openapi: 3.1.0
info:
  title: Knowledge App API
  description: チームナレッジ共有アプリケーションのREST API仕様
  version: 0.1.0

servers:
  - url: http://localhost:8080/api
    description: ローカル開発環境

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [認証]
      summary: ログイン
      description: ユーザー名とパスワードでJWTを発行する
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 認証失敗

  /auth/signup:
    post:
      tags: [認証]
      summary: ユーザー登録
      description: 新規ユーザーアカウントを作成する
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: ユーザー名またはメールアドレスが既に使用されている

  /articles:
    get:
      tags: [記事]
      summary: 記事一覧
      description: ページング・キーワード・タグ条件で記事を検索する
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 記事タイトルのキーワード検索
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 記事一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleSummary"
        "401":
          description: 未認証
    post:
      tags: [記事]
      summary: 記事作成
      description: 新しい記事を作成する（認証必須）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCreateRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "401":
          description: 未認証

  /articles/{id}:
    get:
      tags: [記事]
      summary: 記事詳細
      description: 単一記事の内容を取得する
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: 記事詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "401":
          description: 未認証
        "404":
          description: 記事が存在しない
    put:
      tags: [記事]
      summary: 記事更新
      description: タイトル・本文・タグを編集する
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
        "401":
          description: 未認証
        "403":
          description: 権限なし
        "404":
          description: 記事が存在しない
    delete:
      tags: [記事]
      summary: 記事削除
      description: 記事を削除する（作成者または管理者のみ）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "204":
          description: 削除成功
        "401":
          description: 未認証
        "403":
          description: 権限なし
        "404":
          description: 記事が存在しない

  /articles/{id}/histories:
    get:
      tags: [履歴]
      summary: 履歴一覧
      description: 記事のバージョン一覧を取得する
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: 履歴一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistorySummary"
        "401":
          description: 未認証
        "404":
          description: 記事が存在しない

  /articles/{id}/histories/{historyId}:
    get:
      tags: [履歴]
      summary: 履歴詳細
      description: 指定バージョンの内容を取得する
      parameters:
        - $ref: "#/components/parameters/ArticleId"
        - name: historyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 履歴詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDetail"
        "401":
          description: 未認証
        "404":
          description: 履歴が存在しない

  /articles/{id}/comments:
    get:
      tags: [コメント]
      summary: コメント一覧
      description: 記事に紐づくコメントを取得する（ページング）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: コメント一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          description: 未認証
        "404":
          description: 記事が存在しない
    post:
      tags: [コメント]
      summary: コメント投稿
      description: 記事にコメントを投稿する（認証必須）
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "201":
          description: 投稿成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: 未認証
        "404":
          description: 記事が存在しない

  /admin/users:
    get:
      tags: [ユーザー管理]
      summary: ユーザー一覧
      description: 管理者がユーザー一覧を取得する
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: ユーザー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: 未認証
        "403":
          description: 権限なし（管理者なし）

  /admin/users/{userId}:
    patch:
      tags: [ユーザー管理]
      summary: ユーザー情報更新
      description: 管理者がユーザーのロールや有効情報を変更する
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 未認証
        "403":
          description: 権限なし（管理者なし）
        "404":
          description: ユーザーが存在しない

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: user1
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: トークン有効期間（秒）
          example: 3600

    ArticleSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: Spring Boot入門
        author:
          type: string
          example: user1
        tags:
          type: array
          items:
            type: string
          example: [spring, backend]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
          description: Markdown形式の本文
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleCreateRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          example: Spring Securityガイド
        content:
          type: string
          example: 記事内容...
        tags:
          type: array
          items:
            type: string
          example: [spring, security]

    ArticleUpdateRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string

    HistorySummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
        editedBy:
          type: string
        editedAt:
          type: string
          format: date-time

    HistoryDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        articleId:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        version:
          type: integer
        editedBy:
          type: string
        editedAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        articleId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        author:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: 参考になりました

    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: newuser
        email:
          type: string
          format: email
          example: newuser@example.com
        password:
          type: string
          format: password
    
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        enabled:
          type: boolean
          description: 有効状態
        createdAt:
          type: string
          format: date-time
    
    UserUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum: [USER, ADMIN]
        enabled:
          type: boolean